<form class="filters" method="get"><label>Desde <input type="date" name="desde" value="{{ request.GET.desde }}"><input type="time" name="desde_hora" aria-label="Hora inicial" value="{{ request.GET.desde_hora }}"></label><label>Hasta <input type="date" name="hasta" value="{{ request.GET.hasta }}"><input type="time" name="hasta_hora" aria-label="Hora final" value="{{ request.GET.hasta_hora }}"></label><select name="tipo" aria-label="Tipo"><option value="">Todos los tipos</option>{% for t in tipos_medicion %}<option {% if request.GET.tipo == t %}selected{% endif %}>{{ t }}</option>{% endfor %}</select>{% if colmenas %}<select name="colmena" aria-label="Colmena"><option value="">Todas las colmenas</option>{% for c in colmenas %}<option value="{{ c.pk }}" {% if request.GET.colmena == c.pk|stringformat:'s' %}selected{% endif %}>{{ c.numero_historico }} · {{ c.nombre }}{% if c.archivada %} (archivada){% endif %}</option>{% endfor %}</select>{% endif %}{% if sensores %}<select name="sensor" aria-label="Sensor"><option value="">Todos los sensores</option>{% for s in sensores %}<option value="{{ s.pk }}" {% if request.GET.sensor == s.pk|stringformat:'s' %}selected{% endif %}>{{ s.codigo }}</option>{% endfor %}</select>{% endif %}<select name="origen" aria-label="Origen"><option value="">Todos los orígenes</option><option {% if request.GET.origen == 'SIMULADO' %}selected{% endif %}>SIMULADO</option><option {% if request.GET.origen == 'REAL' %}selected{% endif %}>REAL</option></select><button class="btn">Filtrar</button><a href="{{ request.path }}">Limpiar</a></form>
