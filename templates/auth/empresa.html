{% load static %}<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#FFC72C"><title>ApiTech - Verificar empresa</title><link rel="stylesheet" href="{% static 'vendor/fontawesome/css/all.min.css' %}"><link rel="stylesheet" href="{% static 'css/login.css' %}"></head><body><div class="container"><div class="logo"><img src="{% static 'img/apitech_logo.png' %}" alt="ApiTech Logo"><h2>ApiTech</h2></div>
    {% if error %}<div class="alert alert-danger"><i class="fa-solid fa-circle-exclamation"></i><span>{{ error }}</span></div>{% endif %}
    <div id="verificar-nit" class="slide"><div class="title">Verifica tu empresa</div><p style="text-align:center;margin-bottom:20px;color:#666">Ingresa el NIT de tu empresa apicultora para continuar.</p><form method="post" action="{% url 'login_empresa' %}" novalidate>{% csrf_token %}<div class="input-group"><input type="text" name="nit" placeholder="NIT de la empresa (Ej: 900123456-7)" required autofocus><i class="fa-solid fa-building"></i></div><button type="submit" class="btn"><i class="fa-solid fa-arrow-right"></i> Continuar</button></form><a href="{% url 'login' %}" style="display:block;text-align:center;margin-top:14px;color:#555">Soy del equipo ApiTech</a></div></div></body></html>
