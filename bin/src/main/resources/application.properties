# ─────────────────────────────────────────────────────────────
# ApiTech MK5 — application.properties
# ─────────────────────────────────────────────────────────────

spring.application.name=apitech-mk5

# MySQL es el datasource oficial del proyecto. El esquema definitivo incluye
# triggers, ENUM, columnas generadas y claves compuestas que no debe generar Hibernate.
spring.datasource.url=jdbc:mysql://localhost:3306/apitech?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=apitech
spring.datasource.password=ApiTech2026*
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=false

# ── Thymeleaf ────────────────────────────────────────────────
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ── Servidor ─────────────────────────────────────────────────
server.port=${PORT:8080}
server.error.include-message=always
server.servlet.context-path=${CONTEXT_PATH:}

# Importación CSV/XLSX: el servicio valida también tamaño y extensión.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
