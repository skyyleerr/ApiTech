<table><thead><tr><th>Tipo</th><th>Lecturas</th><th>Mínimo</th><th>Máximo</th><th>Promedio</th></tr></thead><tbody>{% for s in estadisticas %}<tr><td>{{ s.tipo_medicion }} ({{ s.unidad }})</td><td>{{ s.cantidad }}</td><td>{{ s.minimo|floatformat:3 }}</td><td>{{ s.maximo|floatformat:3 }}</td><td>{{ s.promedio|floatformat:3 }}</td></tr>{% empty %}<tr><td colspan="5">No hay datos para calcular estadísticas.</td></tr>{% endfor %}</tbody></table>
